<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#800004" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#FFC700" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Square -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="6" stroke-dasharray="12 8"/>

  <!-- Stamp Base Handle Icon -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Stamp Top Knob -->
    <path d="M 256 110 C 230 110 215 125 215 145 C 215 165 235 175 238 190 L 274 190 C 277 175 297 165 297 145 C 297 125 282 110 256 110 Z" fill="url(#goldGrad)" />
    <!-- Stamp Collar -->
    <rect x="220" y="190" width="72" height="18" rx="4" fill="#FFFFFF" />
    <!-- Stamp Base Mount -->
    <path d="M 170 240 L 342 240 L 360 270 L 152 270 Z" fill="url(#goldGrad)" />
    <!-- Stamp Impression Rubber Pad -->
    <rect x="140" y="270" width="232" height="24" rx="6" fill="#FFFFFF" />
  </g>

  <!-- Flash Lightning Bolt Emblem -->
  <polygon points="270,250 205,360 252,360 230,440 315,320 265,320" fill="url(#goldGrad)" stroke="#800004" stroke-width="4" filter="url(#shadow)"/>
</svg>
